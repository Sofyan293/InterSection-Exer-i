<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm p-4">
                    <h2 class="h5 mb-4">Veuillez remplir ce formulaire :</h2>
                    
                    <form>
                        <div class="mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="genre" id="homme" checked>
                                <label class="form-check-label" for="homme">
                                    Homme
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="genre" id="femme">
                                <label class="form-check-label" for="femme">
                                    Femme
                                </label>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <label for="nom" class="col-sm-3 col-form-label">Nom :</label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" id="nom">
                            </div>
                        </div>

                        <div class="row mb-3">
                            <label for="prenom" class="col-sm-3 col-form-label">Prénom :</label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" id="prenom">
                            </div>
                        </div>

                        <div class="row mb-3">
                            <label for="email" class="col-sm-3 col-form-label">Adresse e-mail :</label>
                            <div class="col-sm-9">
                                <input type="email" class="form-control" id="email">
                            </div>
                        </div>

                        <div class="row mb-3">
                            <label for="password" class="col-sm-3 col-form-label">Mot de passe :</label>
                            <div class="col-sm-9">
                                <input type="password" class="form-control" id="password">
                            </div>
                        </div>

                        <div class="text-start">
                            <button type="submit" class="btn btn-primary">Envoyer</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
